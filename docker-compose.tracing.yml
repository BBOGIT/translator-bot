version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: translator-bot-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
    networks:
      - translator-bot-network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: translator-bot-otel-collector
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes:
      - ./config/otel-collector:/etc/otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    depends_on:
      - jaeger
    networks:
      - translator-bot-network
    restart: unless-stopped

networks:
  translator-bot-network:
    external: true