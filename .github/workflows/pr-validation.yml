name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint with report
        run: npx eslint --ext .ts src/ --format json --output-file eslint-report.json
        continue-on-error: true
      
      - name: Annotate PR with ESLint warnings/errors
        uses: ataylorme/eslint-annotate-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          report-json: eslint-report.json
      
      - name: Check code quality
        run: |
          # Check for console.log statements
          if grep -r "console.log" --include="*.ts" src/ | grep -v "Logger"; then
            echo "Warning: console.log statements found in code"
            exit 1
          fi
          
          # Check for `any` type usage
          any_count=$(grep -r ": any" --include="*.ts" src/ | wc -l)
          if [ $any_count -gt 20 ]; then
            echo "Warning: Excessive use of 'any' type ($any_count instances)"
            exit 1
          fi 