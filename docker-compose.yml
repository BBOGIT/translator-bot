version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: translator-bot-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-translator_bot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - translator-bot-network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: translator-bot-redis
    ports:
      - "6379:6379"
    networks:
      - translator-bot-network
    volumes:
      - redis-data:/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: translator-bot-app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-translator_bot}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    ports:
      - "1889:1889"
    networks:
      - translator-bot-network
    restart: unless-stopped

networks:
  translator-bot-network:
    external: true

volumes:
  postgres-data:
  redis-data: