input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json
  }
  udp {
    port => 5000
    codec => json
  }
}

filter {
  if [docker][container][name] {
    mutate {
      add_field => { "container_name" => "%{[docker][container][name]}" }
    }
  }

  if [kubernetes][container][name] {
    mutate {
      add_field => { "container_name" => "%{[kubernetes][container][name]}" }
    }
  }

  if [container_name] =~ /^app-/ {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:log_level} \[%{DATA:service}\] %{GREEDYDATA:log_message}" }
    }
  }

  if [message] =~ "error" or [message] =~ "exception" or [message] =~ "ERROR" or [message] =~ "Exception" {
    mutate {
      add_tag => ["error"]
    }
  }

  if [message] =~ "warn" or [message] =~ "WARN" or [message] =~ "Warning" {
    mutate {
      add_tag => ["warning"]
    }
  }

  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS" ]
    target => "@timestamp"
    remove_field => [ "timestamp" ]
    timezone => "UTC"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
    manage_template => false
  }

  # Для виводу помилок в окремий індекс
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "errors-%{+YYYY.MM.dd}"
      manage_template => false
    }
  }
} 